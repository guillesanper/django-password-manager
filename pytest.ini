; pytest.ini de la RAÍZ del repo — contexto HOST (niveles L0 y L2).
;
; NO configura Django a propósito: los L0 leen ficheros como texto/AST y NUNCA
; importan `demo.settings` (settings.py:39 exige DJANGO_SECRET_KEY del entorno y
; minio_service.py instancia MinIO a nivel de módulo; ver §2.1 del PLAN-DE-PRUEBAS.md).
; La configuración de Django vive en el OTRO pytest.ini, el de backend/, que corre
; dentro del contenedor `web` con DJANGO_SETTINGS_MODULE=myapp.tests.settings_test.
;
; Por eso aquí NO hay [pytest] con `DJANGO_SETTINGS_MODULE` ni se carga pytest-django:
; este contexto no debe poder importar Django.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -ra imprime al final el resumen de xfail/skip: leído en orden, es el inventario
; de deuda de Fase 3 (los `reason` empiezan por el ID del hallazgo).
; --strict-markers: un marcador no declarado aquí es error, no aviso silencioso.
addopts = -ra --strict-markers

; xfail_strict: un XPASS es fallo ROJO. El día que la Fase 3 cierre M5/M9, la suite
; obliga a retirar el xfail en vez de pasar el arreglo por alto (§3).
xfail_strict = true

markers =
    ; --- niveles (§2 del PLAN-DE-PRUEBAS.md) ---
    l0: estático de repo/config; host; nunca importa Django.
    l1: unitario Django; dentro del contenedor `web`.
    l2: integración por HTTP real contra la pila; host.
    l3: frontend (crypto.ts / passwordGenerator.ts) con vitest; host.
    l4: manual con guion; registrado como skip para que se liste.
    ; --- etiquetas de pila (obligatorias en L1 y L2; trampa 1/4) ---
    stack_prod: exige `docker compose -f docker-compose.yml` (gunicorn x3, TLS, nginx).
    stack_dev: exige `docker compose up` a secas (override: runserver, DEBUG, web:8000).
    ; --- deuda y orden ---
    fase3: hallazgo que cierra en Fase 3 (M5, M9, straggler M1); xfail estricto.
    serial: NO paraleliza; corre al final con flush de Redis antes y despues (rate limit).
    manual: paso humano; se colecciona pero no se ejecuta automaticamente.
