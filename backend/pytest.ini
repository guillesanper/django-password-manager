; pytest.ini de backend/ — contexto CONTENEDOR (nivel L1, dentro de `web`).
;
; A diferencia del pytest.ini de la RAÍZ (que NO configura Django porque en el host
; settings.py:39 exige DJANGO_SECRET_KEY y minio_service instancia a nivel de módulo,
; §2.1 del PLAN-DE-PRUEBAS.md), este SÍ configura Django: aquí la pila está levantada
; y las variables de entorno (.env) están presentes.
;
; DJANGO_SETTINGS_MODULE apunta al settings de test dentro del paquete que sustituye a
; tests.py. Ese módulo hace `from demo.settings import *` y sólo toca 5 cosas (§6).
;
; WORKDIR del contenedor = /usr/src/app (backend/ copiado con `COPY . .`), así que
; `myapp/tests` y `myapp.tests.settings_test` resuelven desde aquí.

[pytest]
DJANGO_SETTINGS_MODULE = myapp.tests.settings_test
testpaths = myapp/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -ra lista al final los motivos de xfail/skip = inventario de deuda de Fase 3.
; --strict-markers: un marcador no declarado abajo es error, no aviso silencioso.
addopts = -ra --strict-markers

; xfail_strict: un XPASS es fallo ROJO (§3). El día que cierre M5/M9 la suite obliga
; a retirar el xfail en vez de pasar el arreglo por alto.
xfail_strict = true

markers =
    ; --- niveles (§2 del PLAN-DE-PRUEBAS.md) ---
    l0: estático de repo/config; host; nunca importa Django.
    l1: unitario Django; dentro del contenedor `web`.
    l2: integración por HTTP real contra la pila; host.
    l3: frontend (crypto.ts / passwordGenerator.ts) con vitest; host.
    l4: manual con guion; registrado como skip para que se liste.
    ; --- etiquetas de pila (obligatorias en L1 y L2; trampa 1/4) ---
    stack_prod: exige `docker compose -f docker-compose.yml` (gunicorn x3, TLS, nginx).
    stack_dev: exige `docker compose up` a secas (override: runserver, DEBUG, web:8000).
    ; --- deuda y orden ---
    fase3: hallazgo que cierra en Fase 3 (M5, M9, straggler M1); xfail estricto.
    serial: NO paraleliza; corre al final con flush de Redis antes y despues (rate limit).
    manual: paso humano; se colecciona pero no se ejecuta automaticamente.
