events {
    worker_connections 1024;
}

http {
    upstream backend_django {
        server web:8000;
    }
    
    upstream backend_minio_api {
        server minio:9000;
    }
    
    upstream backend_minio_console {
        server minio:9001;
    }
    
    upstream backend_grafana {
        server grafana:3000;
    }

    # Backend Django
    server {
        listen 80;
        server_name localhost;
        
        location / {
            proxy_pass http://backend_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # MinIO API (interno)
    server {
        listen 9000;
        server_name localhost;
        
        location / {
            proxy_pass http://backend_minio_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # MinIO Console  
    server {
        listen 9001;
        server_name localhost;
        
        location / {
            proxy_pass http://backend_minio_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}