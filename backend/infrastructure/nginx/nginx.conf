events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No anunciar la versión exacta en cabeceras ni en páginas de error.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream backend_django {
        server web:8000;
    }

    # -------------------------------------------------------------------------
    # Rate limiting por IP (A12).
    #
    # $binary_remote_addr, no $http_x_forwarded_for: nginx es el borde, así que
    # $remote_addr es la única IP que el cliente no puede falsificar. Limitar por
    # una cabecera que el atacante controla no limita nada, y además permite
    # bloquear a terceros (ver A4/M12).
    #
    # 10m de zona ≈ 160 000 IPs distintas en seguimiento.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # 429, no el 503 por defecto: es el código que el frontend y los criterios de
    # aceptación de la Fase 1 esperan.
    limit_req_status  429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Ajustes TLS comunes.
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling queda desactivado a propósito: el certificado de desarrollo es
    # autofirmado y no tiene responder OCSP. Activar al poner uno real.

    # -------------------------------------------------------------------------
    # :80 — sólo redirige. No hay ninguna ruta servida en texto plano.
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Ruta del desafío HTTP-01 de Let's Encrypt, para cuando haya dominio.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # :443 — la aplicación.
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # El límite de subida de file_views.py es de 100 MB; por debajo de esa
        # cifra nginx cortaría con 413 antes de que Django pudiera responder su
        # propio error. El margen cubre la sobrecarga del multipart.
        client_max_body_size 110m;
        client_body_timeout  120s;

        # ---------------------------------------------------------------------
        # Cabeceras de seguridad — SÓLO las que Django no emite ya.
        #
        # `add_header` de nginx AÑADE, no reemplaza: poner aquí una cabecera que
        # el upstream ya envía produce dos cabeceras iguales en la respuesta.
        # Django (SecurityMiddleware + XFrameOptionsMiddleware) es la autoridad
        # para Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options
        # y Referrer-Policy, así que aquí no se repiten. Contrapartida asumida:
        # las respuestas que genera nginx sin llegar a Django (429 de limit_req,
        # 502 si `web` está caído) no las llevan.
        #
        # Content-Security-Policy tampoco va aquí: la emite django-csp desde la
        # aplicación (Fase 1, paso 9), que es quien puede generar el nonce por
        # respuesta.
        #
        # `always` hace que la cabecera se envíe también en respuestas 4xx/5xx,
        # que es justo donde más falta hace.
        # ---------------------------------------------------------------------
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        # Cross-Origin-Opener-Policy la emite YA Django: SECURE_CROSS_ORIGIN_OPENER_POLICY
        # vale 'same-origin' por defecto desde Django 4.1, y SecurityMiddleware la añade en
        # cada respuesta. Repetirla aquí con add_header la DUPLICABA (dos cabeceras iguales,
        # T2). Se retira: Django es la autoridad, igual que con HSTS/X-Frame/nosniff/Referrer.

        limit_conn conn_zone 50;

        # ---------------------------------------------------------------------
        # Parámetros comunes del proxy.
        #
        # X-Forwarded-Proto es el que faltaba y el que hacía imposible activar
        # DJANGO_TLS_ENABLED: sin él Django nunca ve `https`, y con
        # SECURE_SSL_REDIRECT activo redirige en bucle infinito.
        # ---------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # gunicorn corre con --timeout 120 porque descifrar dos veces un fichero
        # grande lo supera; nginx debe esperar al menos lo mismo o cortaría antes
        # con un 504 espurio.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Login y registro: 5 por minuto, con margen para reintentos legítimos.
        # `nodelay` deja pasar la ráfaga de inmediato y sólo entonces limita, en
        # vez de encolar y dar la sensación de que la página se ha colgado.
        location ~ ^/auth/(login|register)/ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://backend_django;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_django;
        }

        # Estáticos con hash en el nombre (Vite + ManifestStaticFilesStorage):
        # el contenido de una URL dada no cambia nunca, así que se pueden cachear
        # de forma agresiva. Los sirve whitenoise desde la propia aplicación.
        #
        # `expires`, no `add_header Cache-Control`: los `add_header` de un
        # `location` ANULAN todos los heredados del `server`, así que declarar uno
        # aquí dejaría a los estáticos sin Permissions-Policy ni COOP. `expires`
        # no es add_header y por tanto conserva la herencia. (whitenoise ya envía
        # su propio Cache-Control immutable para los ficheros con hash.)
        location /staticfiles/ {
            expires 1y;
            proxy_pass http://backend_django;
        }

        location / {
            proxy_pass http://backend_django;
        }
    }

    # -------------------------------------------------------------------------
    # Los bloques `server` de MinIO (:9000 API y :9001 consola) se han eliminado.
    #
    # Publicaban la consola de administración del almacén de ficheros cifrados a
    # través del proxy (A12). Django habla con minio:9000 por la red interna de
    # Docker y no necesita pasar por aquí; no se usan URLs prefirmadas en ningún
    # punto del backend, así que nada más dependía de esto. Para administrar
    # MinIO en local, el override de desarrollo publica 9001 en 127.0.0.1.
    # -------------------------------------------------------------------------
}
