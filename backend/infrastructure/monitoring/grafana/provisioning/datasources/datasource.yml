apiVersion: 1

datasources:
  - name: Prometheus
    # uid fijo: las reglas de alerta (provisioning/alerting) citan la fuente por uid (N18).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
    secureJsonData: {}