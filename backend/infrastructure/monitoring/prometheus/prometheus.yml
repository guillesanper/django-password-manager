global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # MinIO: métricas de clúster (capacidad, peticiones S3). Requiere
  # MINIO_PROMETHEUS_AUTH_TYPE=public en el servicio minio.
  - job_name: 'backend-minio'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/cluster
    scheme: http

  # MinIO: métricas por bucket (objetos, uso). Viven en su propio endpoint.
  - job_name: 'backend-minio-bucket'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/bucket
    scheme: http

  # Django (django_prometheus). Por la red interna, sin nginx: settings.py exime
  # /metrics de SECURE_SSL_REDIRECT y nginx no lo sirve hacia fuera.
  - job_name: 'backend-django'
    static_configs:
      - targets: ['web:8000']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # PostgreSQL vía postgres_exporter (Postgres no expone métricas por HTTP).
  - job_name: 'backend-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
