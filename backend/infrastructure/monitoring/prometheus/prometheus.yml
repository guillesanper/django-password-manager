global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # MinIO metrics integrado
  - job_name: 'backend-minio'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/cluster
    scheme: http

  # Django backend metrics
  - job_name: 'backend-django'
    static_configs:
      - targets: ['web:8000']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # Postgres backend metrics  
  - job_name: 'backend-postgres'
    static_configs:
      - targets: ['db:5432']
    scrape_interval: 30s