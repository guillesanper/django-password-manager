<!-- templates/base.html -->
{% load django_vite %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    {% if debug %}
        {% vite_hmr_client %}
    {% endif %}
    {% vite_asset 'main.tsx' %}
</head>
<body>
    <div id="root"></div>
    
    <!-- Datos de Django para React -->
    <script>
        window.djangoData = {
            user: {
                id: {{ user.id|default:'null' }},
                username: "{{ user.username|default:'' }}",
                email: "{{ user.email|default:'' }}",
                isAuthenticated: {{ user.is_authenticated|yesno:"true,false" }}
            },
            csrfToken: "{{ csrf_token }}",
            urls: {
                login: "{% url 'login' %}",
                register: "{% url 'register' %}",
                logout: "{% url 'logout' %}",
                home: "{% url 'home' %}",
                accounts: "{% url 'accounts' %}",
                createPassword: "{% url 'create_password' %}",
                unlockPassword: "{% url 'unlock_password' 0 %}".replace('0', 'ID_PLACEHOLDER'),
                deletePassword: "{% url 'delete_password' 0 %}".replace('0', 'ID_PLACEHOLDER'),
                updatePassword: "{% url 'update_password' 0 %}".replace('0', 'ID_PLACEHOLDER'),
                passwordGenerator: "{% url 'password_generator' %}",
                listFiles: "{% url 'list_files' %}",
                uploadFile: "{% url 'upload_file' %}",
                downloadFile: "{% url 'download_file' 0 %}".replace('0', 'ID_PLACEHOLDER'),
                deleteFile: "{% url 'delete_file' 0 %}".replace('0', 'ID_PLACEHOLDER'),
                deleteAllFiles: "{% url 'delete_all_files' %}",
                settings: "{% url 'settings_view' %}"
            }
        };
    </script>
</body>
</html>
