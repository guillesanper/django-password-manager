version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser  
      POSTGRES_PASSWORD: password
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis para cache y rate limiting
  redis:
    image: redis:7.2-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Aplicación Django
  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
      - ./infrastructure/logs/django:/var/log/django
    environment:
      - DEBUG=1  # Cambiado temporalmente para debugging
      - POSTGRES_DB=mydb
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1  # Nueva variable
      # Variables MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=user-encrypted-files
      - MINIO_USE_SSL=false
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py setup_minio_buckets &&
             python manage.py runserver 0.0.0.0:8000"

  # MinIO para almacenamiento
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: backend-minio
    networks:
      - app-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_ultra_secure_2024}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinIO_Ultra_Secure_Password_2024!@#}
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - minio_data:/data
      - ./infrastructure/minio/policies:/policies:ro
      - ./infrastructure/logs/minio:/var/log/minio
    command: >
      server /data 
      --console-address ":9001"
      --json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Nginx proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: backend-proxy
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - ./infrastructure/logs/nginx:/var/log/nginx
    depends_on:
      - web
      - minio
    restart: unless-stopped

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: backend-prometheus
    networks:
      - app-network
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    restart: unless-stopped

  # Grafana para visualización
  grafana:
    image: grafana/grafana:10.1.0
    container_name: backend-grafana
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-secure_grafana_2024}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Webhook collector para auditoría
  webhook-collector:
    build: ./infrastructure/webhook-collector
    container_name: backend-audit
    networks:
      - app-network
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/logs/audit:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - POSTGRES_URL=postgresql://myuser:password@db:5432/mydb
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:  # Nuevo volumen para Redis
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge